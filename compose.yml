services:
  db:
    image: postgres:15
    container_name: react_django_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - react_django_pg_data:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432

  pdadmin:
    image: dpage/pgadmin4:latest
    container_name: react_django_pdadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    volumes:
      - react_django_pgadmin_data:/var/lib/pgadmin
    ports:
      - 5050:80
    depends_on:
      - db

  backend:
    container_name: react_django_backend
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - 8000:8000
    depends_on:
      - db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  frontend:
    container_name: react_django_frontend
    build: ./frontend
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - 5173:5173
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  node_modules:
  react_django_pg_data:
  react_django_pgadmin_data: